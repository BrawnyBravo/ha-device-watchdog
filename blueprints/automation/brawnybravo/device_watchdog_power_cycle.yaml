blueprint:
  name: Device watchdog - power cycle an unresponsive device
  description: >
    Watches an entity and, if it stays unavailable (or unknown) for longer than a
    configured grace period, power-cycles the device through a smart plug or relay:
    the switch is turned off, held off briefly, then turned back on.

    A rate limit keeps a flapping device from being cycled endlessly, and an
    optional notification action lets you be told whenever a cycle happens.

    Typical use: a display, media player, camera or sensor hub that occasionally
    hangs and only comes back after its power is interrupted.

    For robots and appliances (vacuums, litter boxes, anything with a cycle),
    the "busy" guard refuses to cut power if the device was last seen mid-cycle,
    and an optional gentler first step (reload, refresh, return to base) is
    tried before the plug is touched.
  domain: automation
  source_url: https://github.com/BrawnyBravo/ha-device-watchdog/blob/main/blueprints/automation/brawnybravo/device_watchdog_power_cycle.yaml
  input:
    watched_entity:
      name: Entity to watch
      description: >
        The entity that shows whether the device is alive. Pick something that goes
        to "unavailable" when the device drops off - for example a media player, a
        sensor it publishes, or a ping binary sensor.
      selector:
        entity: {}
    power_switch:
      name: Power switch
      description: >
        The switch that supplies power to the device - usually a smart plug or an
        in-wall relay. It must be a separate device from the one being watched,
        otherwise the automation cannot turn it back on.
      selector:
        entity:
          domain: switch
    unavailable_for:
      name: Unavailable for
      description: >
        How long the watched entity must stay unavailable/unknown before the
        automation acts. Keep this comfortably longer than the device's normal
        reboot, update or Wi-Fi reconnect time.
      default:
        hours: 0
        minutes: 10
        seconds: 0
      selector:
        duration: {}
    power_off_duration:
      name: Power off for
      description: >
        How long power stays cut before it is restored. Ten to thirty seconds is
        usually enough to fully discharge a small device.
      default:
        hours: 0
        minutes: 0
        seconds: 15
      selector:
        duration: {}
    recovery_grace:
      name: Recovery grace period
      description: >
        How long to wait after power returns before treating the device as
        recovered. This also blocks the automation from starting a second cycle
        while the device is still booting.
      default:
        hours: 0
        minutes: 3
        seconds: 0
      selector:
        duration: {}
    max_cycles:
      name: Maximum power cycles per window
      description: >
        The most power cycles allowed inside the cooldown window below. Raising
        this shortens the minimum spacing between cycles. See the README for how
        this approximation works.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider
    cooldown_window:
      name: Cooldown window
      description: >
        The rolling window the cycle limit applies to. With the default of one hour
        and three cycles, a new cycle is allowed only if the last one was more than
        twenty minutes ago.
      default:
        hours: 1
        minutes: 0
        seconds: 0
      selector:
        duration: {}
    busy_states:
      name: Never cut power if last seen in these states
      description: >
        If the watched entity's last state before it went unavailable is one of
        these, or a busy entity below is in one of them, power is not cut. This
        stops a vacuum, litter box or other appliance being switched off in the
        middle of a cycle. Matching ignores case. Add your device's own words:
        a litter box's status sensor often uses short codes (check its states
        in Developer tools), and you may want "paused" for a vacuum. The defaults are not states a
        display or media player uses, so they change nothing for those.
      default:
        - cleaning
        - returning
        - cycling
        - washing
        - drying
        - emptying
        - mowing
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - cleaning
            - returning
            - cycling
            - washing
            - drying
            - emptying
            - mowing
    busy_entities:
      name: Busy entities (optional)
      description: >
        Extra entities that say whether the device is mid-cycle, for example a
        status sensor. If any of them is in a busy state above, power is not cut.
        An entity that is itself unavailable counts as not busy, since it usually
        drops out together with the device.
      default: []
      selector:
        entity:
          multiple: true
    gentle_action:
      name: Gentler first step (optional)
      description: >
        Actions to try before cutting power - for example reload the device's
        integration, refresh the entity, or send a robot back to its base. If
        the watched entity comes back within the wait below, power is never cut.
        If a step fails, the run stops without cutting power. Empty by default.
      default: []
      selector:
        action: {}
    gentle_wait:
      name: Wait after the gentler step
      description: >
        How long to give the gentler step to bring the device back before
        falling through to the power cycle.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}
    other_notify_action:
      name: Notification when power was NOT cut (optional)
      description: >
        Actions to run when the run ends without a power cycle: the device was
        busy, or the gentler step brought it back. The variable
        `watchdog_outcome` is `skipped_busy` or `recovered_by_gentle_step`.
      default: []
      selector:
        action: {}
    notify_action:
      name: Notification action (optional)
      description: >
        Actions to run after power has been restored - send a notification, write
        to the logbook, flash a light, or nothing at all. Leave empty to stay quiet.
      default: []
      selector:
        action: {}

# "single" plus the wait steps below means one cycle must finish, including the
# recovery grace period, before another can begin.
mode: single
max_exceeded: silent

variables:
  watched_entity: !input watched_entity
  busy_list: !input busy_states
  busy_entities: !input busy_entities
  gentle_steps: !input gentle_action
  # The state the device was in just before it dropped out (the template
  # trigger keeps the change that made it true). Empty after a restart, when
  # only the busy entities can show the device is mid-cycle.
  last_state: >-
    {{ (trigger.from_state.state if trigger is defined and trigger.from_state is defined and trigger.from_state
        else '') | lower }}
  max_cycles: !input max_cycles
  cooldown_window: !input cooldown_window
  # Duration selectors hand back a mapping, so flatten it to seconds for the
  # cooldown maths below.
  cooldown_seconds: >-
    {{ (cooldown_window.days | default(0) | int) * 86400
     + (cooldown_window.hours | default(0) | int) * 3600
     + (cooldown_window.minutes | default(0) | int) * 60
     + (cooldown_window.seconds | default(0) | int) }}
  # Minimum spacing between cycles that keeps the count inside the window at or
  # below the configured maximum.
  min_gap_seconds: >-
    {{ (cooldown_seconds | float(0)) / (max_cycles | float(1)) }}

trigger_variables:
  watched_trigger: !input watched_entity

# A template trigger rather than a state trigger: it stays true (and its timer
# keeps running) while the entity flips between unavailable and unknown, and
# its from_state stays the last real state ("cleaning", say) that the busy
# guard reads. A state trigger restarts on that flip and loses the real state.
triggers:
  - trigger: template
    value_template: >-
      {{ states(watched_trigger) in ['unavailable', 'unknown'] }}
    for: !input unavailable_for
  # A template trigger only arms once it has seen the device up, so a device
  # that is already down when Home Assistant starts (hung after a power blip,
  # say) would never be caught. The startup run waits out the same grace period
  # in the actions below before doing anything.
  - trigger: homeassistant
    event: start
    id: startup

conditions:
  # Re-check the live state: the entity may have recovered between the trigger
  # firing and this automation getting its turn to run.
  - condition: template
    value_template: >-
      {{ states(watched_entity) in ['unavailable', 'unknown'] }}
  # Rate limit / cooldown.
  #
  # A blueprint has no storage of its own - there is no counter it can keep
  # between runs, and creating a helper entity is not something a blueprint can
  # do. The one piece of history Home Assistant hands an automation about itself
  # is `this.attributes.last_triggered`, the timestamp of the previous run.
  #
  # So instead of counting cycles, we enforce the minimum spacing that produces
  # at most `max_cycles` runs inside `cooldown_window`. It is an approximation:
  # it caps the long-run rate rather than the exact count in any given window,
  # and `last_triggered` is cleared if the automation is reloaded, renamed or
  # Home Assistant restarts - after which one extra cycle may slip through.
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds()
            > (min_gap_seconds | float(0)) }}

actions:
  - alias: After a restart, give the device the same grace period
    if:
      - condition: trigger
        id: startup
    then:
      - wait_template: >-
          {{ states(watched_entity) not in ['unavailable', 'unknown'] }}
        timeout: !input unavailable_for
        continue_on_timeout: true
      # Carry on only if it is still down and the entity really exists (a
      # removed entity reads as "unknown" too and must never cause a power
      # cut). A plain condition here would only end this branch, so stop.
      - if:
          - condition: template
            value_template: >-
              {{ states[watched_entity] is none
                 or states(watched_entity) not in ['unavailable', 'unknown'] }}
        then:
          - stop: Device came back after the restart, or does not exist.

  - alias: Do not cut power mid-cycle
    if:
      - condition: template
        value_template: &busy >-
          {% set busy = busy_list | map('lower') | list %}
          {% set ents = [busy_entities] if busy_entities is string
                        else busy_entities %}
          {% set ns = namespace(hit = last_state in busy) %}
          {% for e in ents %}
            {% if states(e) | lower in busy %}{% set ns.hit = true %}{% endif %}
          {% endfor %}
          {{ ns.hit }}
    then:
      - variables:
          watchdog_outcome: skipped_busy
      - choose:
          - conditions: []
            sequence: !input other_notify_action
      - stop: Device was mid-cycle; power left on.

  - alias: Gentler first step
    if:
      - condition: template
        value_template: "{{ gentle_steps | length > 0 }}"
    then:
      - choose:
          - conditions: []
            sequence: !input gentle_action
      - wait_template: >-
          {{ states(watched_entity) not in ['unavailable', 'unknown'] }}
        timeout: !input gentle_wait
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ states(watched_entity) not in ['unavailable', 'unknown'] }}
        then:
          - variables:
              watchdog_outcome: recovered_by_gentle_step
          - choose:
              - conditions: []
                sequence: !input other_notify_action
          - stop: Device came back after the gentler step.
      # The gentler step may have woken a busy status entity; check again.
      - if:
          - condition: template
            value_template: *busy
        then:
          - variables:
              watchdog_outcome: skipped_busy
          - choose:
              - conditions: []
                sequence: !input other_notify_action
          - stop: Device was mid-cycle; power left on.

  - alias: Cut power
    action: switch.turn_off
    target:
      entity_id: !input power_switch

  - alias: Hold power off
    delay: !input power_off_duration

  - alias: Restore power
    action: switch.turn_on
    target:
      entity_id: !input power_switch

  - alias: Wait for the device to come back
    delay: !input recovery_grace

  - alias: Optional notification
    choose:
      - conditions: []
        sequence: !input notify_action
